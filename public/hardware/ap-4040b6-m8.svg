<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">AP-4040B6-M8 调节脚转接板尺寸图</title>
  <desc id="desc">钢板40乘40乘8毫米，中心M8通牙，四孔中心位于正负10毫米，通孔直径6.6，底面90度沉头直径12.8。四颗DIN7991 M6乘20安装螺钉连接4040 B6的四个攻M6芯孔。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0 0 5 10 10" fill="none" stroke="#334155"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#94a3b8" stroke-width="1"/></pattern>
    <style>
      text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033;font-size:17px}
      .title{font-size:26px;font-weight:bold}.label{font-size:19px;font-weight:bold}.small{font-size:15px}
      .part{stroke:#172033;stroke-width:2;fill:none}.dim{stroke:#334155;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .ext{stroke:#94a3b8;stroke-width:1;fill:none}.axis{stroke:#64748b;stroke-width:1;stroke-dasharray:12 4 2 4;fill:none}
    </style>
  </defs>
  <rect width="1100" height="820" fill="white"/>
  <rect x="25" y="25" width="1050" height="770" fill="none" stroke="#cbd5e1"/>
