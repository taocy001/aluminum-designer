<text x="704" y="302" class="muted">型材接触面</text><text x="1010" y="405" class="muted">脚侧 / 沉头入口</text>
<text x="704" y="482">沉头夹角 90° · 理论深度 3.1</text>
<text x="704" y="511" class="muted">DIN 7991 M6：头径 12，头高 3.3，内六角 4</text>
<text x="704" y="538" class="muted">螺钉顶面低于板底面 0.1；螺纹牙型未绘出</text>
<text x="52" y="617" class="sub">03　加工与装配</text>
<text x="52" y="650">1. 四个安装孔贯穿板厚，沉头均位于脚侧；去除锐边和毛刺。</text>
<text x="52" y="682">2. 4040 B6 四个芯孔攻 M6×1，有效螺纹深度至少 13；另留入口倒角及丝锥导程余量。</text>
<text x="52" y="714">3. 四颗 DIN 7991 M6×20 固定板，进入型材约 12.1；先装转接板，再装调节脚。</text>
<text x="52" y="746">4. Motedis BD40-8x50 脚杆从板底旋入 10，穿出板顶 2；锁紧螺母贴合板底。</text>
<text x="52" y="782" class="muted">适配：Motedis 40×40 B 型槽 6，四个 M6 芯孔。I8 中央孔方案使用不同安装方式。</text>
<text x="52" y="838" class="muted">钢材牌号、加工公差、防腐和承载由制造方确定；本图描述装配几何，无额定承载声明。</text>
</svg>
