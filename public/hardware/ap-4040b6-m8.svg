  <path d="M55 520H1045" class="ext"/>
  <text x="55" y="552" class="label">加工与装配</text>
  <text x="55" y="583">1. 钢板厚 8，四孔以板中心为基准，孔中心坐标 (±10, ±10)。去除锐边和毛刺。</text>
  <text x="55" y="613">2. 4040 B6 的四个芯孔攻 M6×1，有效螺纹至少 13，另留入口倒角及丝锥导程余量。</text>
  <text x="55" y="643">3. 四颗 DIN 7991 M6×20 固定底板；螺钉进入型材约 12.1。先装板，再装脚并锁紧。</text>
  <text x="55" y="673">4. Motedis BD40-8x50 脚杆从板底旋入 10，穿出板顶 2；锁紧螺母贴合板底。</text>
  <text x="55" y="712" class="small">螺钉参考：DIN 7991 M6，头径 12、头高 3.3、内六角 4；螺纹牙型在显示模型中简化。</text>
  <text x="55" y="739" class="small">钢材牌号、加工公差、防腐和承载由制造方按用途确定。本图给出装配几何，无额定承载声明。</text>
  <text x="55" y="774" class="small">适用截面：Motedis 40×40 B 型槽 6（四个 M6 芯孔）；不能替代 I8 中央孔安装方案。</text>
</svg>
