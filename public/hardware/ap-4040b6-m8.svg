<title id="title">AP-4040B6-M8 调节脚转接板</title>
<desc id="desc">40×40×8 钢板，中心 M8×1.25 通牙，四孔坐标正负 10 mm，Ø6.6 通孔，底面 Ø12.8×90° 沉头。右图为单孔局部剖面。</desc>
