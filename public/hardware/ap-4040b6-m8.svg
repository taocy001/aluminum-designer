  <text x="55" y="100">自制加工件 · 单位 mm · 比例示意，以标注尺寸为准</text>

  <text x="135" y="145" class="label">底视图（沉头侧）</text>
  <rect x="155" y="200" width="240" height="240" class="part"/>
